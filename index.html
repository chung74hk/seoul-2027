k nav{background:#17212b}body.dark nav button{background:#22303c;color:#dce5ec}footer{text-align:center;color:var(--muted);padding:28px 12px 40px;font-size:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}nav{top:82px}}

{title:'Day 1｜抵達＋明洞',date:'1/20',tags:['明洞','彈性日','南山備案'],stops:[['抵達後','仁川機場 → 明洞飯店','AREX 至首爾站轉 4 號線；大型行李可搭機場巴士。','Myeongdong Station Seoul','명동역'],['下午','入住、WOWPASS／T-money、便利店補給','先休息與熟悉周邊，不安排太滿。','Myeongdong Shopping Street','명동거리'],['傍晚','南山日落（航班準時才去）','若趕不上，移到 Day 2。','N Seoul Tower','N서울타워'],['晚上','明洞夜市、Olive Young、大創','晚餐可選明洞餃子或烤肉。','Olive Young Myeongdong Town','올리브영 명동타운']]},
{title:'Day 2｜古宮＋韓屋＋醬蟹',date:'1/21',tags:['景福宮','三清洞','北村','仁寺洞','醬蟹'],stops:[['08:30','明洞飯店出發','明洞站 4 號線 → 忠武路轉 3 號線 → 景福宮站 5 號出口。','Gyeongbokgung Palace','경복궁'],['09:00–11:00','景福宮','光化門、勤政殿、慶會樓。','Gyeongbokgung Palace','경복궁'],['11:10–13:00','三清洞步行＋午餐／咖啡','由景福宮東側步行約 10–15 分鐘。','Samcheong-dong Seoul','삼청동'],['13:10–14:40','北村韓屋村','住宅區請保持安靜。','Bukchon Hanok Village','북촌한옥마을'],['14:50–17:00','仁寺洞＋Ssamziegil','文創、茶館、伴手禮。','Insadong Seoul','인사동'],['17:10–18:40','南山日落（Day 1 未完成時）','日落前 30–45 分鐘抵達。','N Seoul Tower','N서울타워'],['19:00','醬蟹晚餐','建議提前預約。','Jinmi Sikdang Seoul','진미식당']]},
{title:'Day 3｜益善洞＋少女服飾＋韓牛',date:'1/22',tags:['益善洞','少女服飾','文青小店','韓牛','清溪川'],stops:[['09:30','明洞飯店出發','明洞站 4 號線 → 忠武路轉 3 號線 → 鐘路三街站。','Jongno 3-ga Station','종로3가역'],['10:00–12:00','益善洞韓屋巷與少女服飾','逛 TETEROT SALON、Obless、SHOP RUDA、Oasis Ikseon。','Ikseon-dong Hanok Village','익선동 한옥거리'],['12:00–13:30','午餐＋韓屋咖啡','可選 Cheongsudang、Mil Toast House。','Cheongsudang Ikseon','청수당 익선'],['13:30–16:30','文青選物、飾品與甜點','香氛、手作飾品、生活雜貨與拍照小巷。','Ikseon-dong Seoul shops','익선동 소품샵'],['17:00','清溪川散步','由益善洞步行或搭一小段地鐵。','Cheonggyecheon Stream','청계천'],['18:00','韓牛晚餐','安排鐘路／乙支路一帶。','Hanwoo restaurant Jongno Seoul','종로 한우 맛집']]},
{title:'Day 4｜Teenage 特色購物',date:'1/23',tags:['聖水洞','延南洞','望遠洞','Teenage'],stops:[['09:00–12:30','聖水洞設計品牌與快閃店','Matin Kim、Stand Oil、EMIS、SATUR、Tamburins 等。','Seongsu-dong Seoul','성수동'],['12:30','咖啡／午餐','Cafe Onion、Rain Report 或附近餐廳。','Cafe Onion Seongsu','카페 어니언 성수'],['14:30–16:30','延南洞特色小店','文具、手作飾品、插畫與選物。','Yeonnam-dong Seoul','연남동'],['17:00–19:00','望遠洞＋望遠市場','小眾服飾、甜點、在地市場。','Mangwon Market','망원시장']]},
{title:'Day 5｜南怡島＋晨靜樹木園',date:'1/24',tags:['雪景','燈飾','一日團'],stops:[['07:20','明洞集合','依一日團通知確認集合點。','Myeongdong Station Exit 3','명동역 3번출구'],['09:30–13:00','南怡島','水杉大道、河岸、雪景。','Nami Island','남이섬'],['13:00','午餐','春川辣炒雞或熱湯。','Dakgalbi near Nami Island','남이섬 닭갈비'],['15:30–20:00','晨靜樹木園冬季燈飾','先看黃昏，再看點燈。','Garden of Morning Calm','아침고요수목원'],['約22:00','返回明洞','羽絨、防滑鞋、暖包必備。','Myeongdong Seoul','명동']]},
{title:'Day 6｜Alpensia 入住＋滑雪',date:'1/25',tags:['Alpensia','入住','初學課'],stops:[['早上','明洞 → Alpensia','建議預訂接駁／包車；確認雪季交通。','Alpensia Ski Resort','알펜시아 리조트'],['中午','入住／寄放行李、租雪具','先熟悉雪鞋、雪板與置物櫃。','Holiday Inn Suites Alpensia','홀리데이 인 스위트 알펜시아'],['下午','初學者課程','建議先上 2–4 小時課程。','Alpensia Ski School','알펜시아 스키학교'],['晚上','度假村晚餐＋早休息','可視體力安排夜滑。','Alpensia Resort Village','알펜시아 리조트']]},
{title:'Day 7｜Alpensia 全天滑雪',date:'1/26',tags:['全天滑雪','度假村'],stops:[['08:00','早餐與熱身','檢查護具、手套、雪鏡。','Alpensia Resort','알펜시아 리조트'],['09:00–12:00','上午滑雪','初學者以綠線／緩坡為主。','Alpensia Ski 700','알펜시아 스키700'],['12:00–13:30','午餐與休息','補水、防曬。','Alpensia Resort restaurant','알펜시아 맛집'],['13:30–16:30','下午滑雪','疲累時提早結束，避免受傷。','Alpensia Ski Resort','알펜시아 리조트'],['晚上','度假村散步／Spa','第二晚住宿。','InterContinental Alpensia','인터컨티넨탈 알펜시아']]},
{title:'Day 8｜上午滑雪＋弘大＋汗蒸幕',date:'1/27',tags:['返首爾','弘大','汗蒸幕'],stops:[['09:00–11:30','最後滑雪','歸還裝備前拍照。','Alpensia Ski Resort','알펜시아 리조트'],['中午','退房、返回首爾','建議直達明洞飯店寄放行李。','Myeongdong Seoul','명동'],['傍晚','弘大購物','Musinsa、AK Plaza、Olive Young。','Hongdae Shopping Street','홍대거리'],['19:00','韓式海鮮晚餐','Jogabi 明洞本店。','Jogabi Seafood Bar Myeongdong','조가비 명동본점'],['21:00','汗蒸幕（可選）','滑雪後放鬆；若做醫美則不要同日高溫。','Sparex Dongdaemun','스파렉스 동대문']]},
{title:'Day 9｜Lotte Mart＋離境',date:'1/28',tags:['最後採購','退稅','機場'],stops:[['上午','退房／寄放行李','確認航班與機場航廈。','Myeongdong Seoul','명동'],['09:30–11:30','Lotte Mart 首爾站店','零食、海苔、泡麵、咖啡。','Lotte Mart ZETTAPLEX Seoul Station','롯데마트 제타플렉스 서울역점'],['出發前','整理退稅與托運','液體與需查驗商品分開。','Seoul Station','서울역'],['依航班','AREX／機場巴士到仁川','國際線建議提前 3 小時。','Incheon International Airport','인천국제공항']]}
];
const foodByDay=days.map((d,i)=>({
restaurant:[[i===1?'醬蟹晚餐':i===2?'韓牛晚餐':i===7?'Jogabi 明洞本店':'當日推薦餐廳','依當日區域選擇人氣料理',i>=5&&i<=7?'₩25,000–80,000':'₩12,000–60,000','出發前請以 Naver Map 確認營業時間',d.stops[0][3],d.stops[0][4]]],
cafe:[['當日 Cafe 推薦','熱飲＋甜點','₩6,000–20,000','冬季建議預留室內休息時間',d.stops[Math.min(1,d.stops.length-1)][3],d.stops[Math.min(1,d.stops.length-1)][4]]],
street:[['特色街頭小食','魚板、糖餅、雞蛋糕或市場小食','₩2,000–10,000','少量多樣分食最方便',d.stops[d.stops.length-1][3],d.stops[d.stops.length-1][4]]]
}));
function mapUrl(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function naverUrl(q){return 'https://map.naver.com/p/search/'+encodeURIComponent(q)}
const tabs=document.getElementById('tabs'),app=document.getElementById('app');
const intro={title:'總覽',date:'',tags:['9天8夜','明洞住宿','冬季版']};
[ intro,...days ].forEach((d,i)=>{const b=document.createElement('button');b.textContent=i===0?'總覽':`D${i}`;b.onclick=()=>show(i);tabs.appendChild(b)});
function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',i===j));localStorage.setItem('day',i)}
function renderOverview(){return `<section class="screen"><div class="hero"><h2>首爾冬季自由行 App</h2><div class="sub">2027/1/20–1/28｜可離線查看主要內容</div><div>${intro.tags.map(x=>`<span class="badge">${x}</span>`).join('')}</div></div>
<div class="toolbar"><input id="globalSearch" placeholder="搜尋景點、餐廳或行程…" oninput="runSearch(this.value)"><button class="iconbtn" onclick="toggleDark()">🌙</button></div>
<div id="searchResults" class="card hidden"></div>
<div class="card"><h3>旅行工具</h3><div class="tabs2">
<button onclick="showTool('favorites')">❤️ 收藏</button>
<button onclick="showTool('budget')">💸 花費</button>
<button onclick="showTool('packing')">🧳 行李</button>
<button onclick="showTool('location')">📍 定位</button>
<button onclick="showTool('currency')">💱 匯率</button>
</div><div id="toolPanel" class="small">選擇一個旅行工具。</div></div><div class="card"><h3>快速行程</h3>${days.map((d,i)=>`<p><b>Day ${i+1}｜${d.date}</b><br>${d.title.split('｜')[1]}</p>`).join('')}</div>
<div class="card"><h3>冬季每日必帶</h3><div class="check">${['護照／信用卡','T-money／WOWPASS','行動電源','暖包','手套／圍巾','護唇膏／護手霜','防滑鞋','保溫水杯'].map((x,i)=>`<label><input type="checkbox" data-k="c${i}">${x}</label>`).join('')}</div></div>
<div class="card"><h3>旅行備忘錄</h3><textarea id="notes" placeholder="輸入訂位號碼、飯店地址、航班資料……"></textarea><p><button class="primary" onclick="saveNotes()">儲存備忘錄</button></p><div class="small">資料只會儲存在這部裝置。</div></div>
<div class="card"><h3>安裝到手機</h3><p>Android／Chrome 可按下方按鈕；iPhone／Safari 請按分享，再選「加入主畫面」。</p><p><button id="installBtn" class="primary" style="display:none">安裝 App</button></p><div class="small">必須透過 HTTPS 網站開啟，PWA 安裝與離線功能才會生效。</div></div></section>`}
function foodCards(title,icon,items){return `<div class="card"><h3 class="sectiontitle"><span>${icon}</span>${title}</h3><div class="foodgrid">${items.map(x=>`<div class="foodcard"><h4>${x[0]}</h4><div><span class="pill">推薦</span>${x[1]}</div><div class="foodmeta"><span class="price">${x[2]}</span><br>${x[3]}</div><div class="maplinks"><a href="${mapUrl(x[4])}" target="_blank" rel="noopener">Google Maps</a><a class="naver" href="${naverUrl(x[5])}" target="_blank" rel="noopener">Naver Map</a></div></div>`).join('')}</div></div>`}
function renderDay(d,idx){const f=foodByDay[idx];return `<section class="screen"><div class="hero"><h2>${d.title}</h2><div class="sub">${d.date}</div><div>${d.tags.map(x=>`<span class="badge">${x}</span>`).join('')}</div></div><div class="card"><h3>照著走</h3><div class="timeline">${d.stops.map(s=>`<div class="stop"><button class="favbtn" data-fav="${idx}|${s[1]}" onclick="toggleFav(this)">♡</button><div class="time">${s[0]}</div><b>${s[1]}</b><div class="route">${s[2]}</div><div class="maplinks"><a href="${mapUrl(s[3])}" target="_blank" rel="noopener">Google Maps</a><a class="naver" href="${naverUrl(s[4])}" target="_blank" rel="noopener">Naver Map</a></div></div>`).join('')}</div></div>${foodCards('餐廳推薦','🍽️',f.restaurant)}${foodCards('Cafe 推薦','☕',f.cafe)}${foodCards('特色街頭小食','🌭',f.street)}<div class="grid"><div class="metric"><span>預算參考</span><b>${idx>=5&&idx<=7?'₩80,000–220,000':'₩60,000–160,000'}</b><span class="small">不含大量購物／住宿</span></div><div class="metric"><span>步行強度</span><b>${idx===4||idx===6||idx===7?'中低':'中等'}</b><span class="small">雪地日請穿防滑鞋</span></div></div><div class="card"><h3>當日提醒</h3><div class="tip">${idx===4?'燈飾日期與集合點需於出發前重新確認。':idx>=5&&idx<=7?'滑雪課程、纜車票、接駁和雪具請提前預訂。':'熱門餐廳與咖啡店建議提前查 Naver 營業資訊。'}</div></div></section>`}
app.innerHTML=renderOverview()+days.map(renderDay).join('');
window.saveNotes=()=>{localStorage.setItem('notes',document.getElementById('notes').value);alert('已儲存')};
document.getElementById('notes').value=localStorage.getItem('notes')||'';
document.querySelectorAll('input[type=checkbox]').forEach(x=>{x.checked=localStorage.getItem(x.dataset.k)==='1';x.onchange=()=>localStorage.setItem(x.dataset.k,x.checked?'1':'0')});
show(Number(localStorage.getItem('day')||0));
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-block'});
document.addEventListener('click',async e=>{if(e.target?.id==='installBtn'&&deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;e.target.style.display='none'}});

const allStops=days.flatMap((d,di)=>d.stops.map(s=>({day:di+1,title:s[1],time:s[0],route:s[2],g:s[3],n:s[4]})));
function getFavs(){return JSON.parse(localStorage.getItem('favs')||'[]')}
function setFavs(v){localStorage.setItem('favs',JSON.stringify(v))}
function refreshFavButtons(){const f=getFavs();document.querySelectorAll('.favbtn').forEach(b=>{const on=f.includes(b.dataset.fav);b.classList.toggle('on',on);b.textContent=on?'♥':'♡'})}
function toggleFav(b){const k=b.dataset.fav;let f=getFavs();f=f.includes(k)?f.filter(x=>x!==k):[...f,k];setFavs(f);refreshFavButtons()}
function runSearch(q){const box=document.getElementById('searchResults');q=q.trim().toLowerCase();if(!q){box.classList.add('hidden');box.innerHTML='';return}const hits=allStops.filter(x=>`${x.title} ${x.route}`.toLowerCase().includes(q)).slice(0,20);box.classList.remove('hidden');box.innerHTML='<h3>搜尋結果</h3>'+(hits.length?hits.map(x=>`<div class="listrow"><div><b>Day ${x.day}｜${x.title}</b><div class="small">${x.time}｜${x.route}</div></div><div class="maplinks"><a href="${mapUrl(x.g)}" target="_blank">地圖</a></div></div>`).join(''):'找不到結果')}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')}
function showTool(t){
 const p=document.getElementById('toolPanel');
 if(t==='favorites'){const f=getFavs();p.innerHTML='<h3>我的收藏</h3>'+(f.length?f.map(k=>{const [d,n]=k.split('|');return `<div class="listrow"><b>Day ${Number(d)+1}｜${n}</b><button class="iconbtn" onclick="removeFav('${k.replaceAll("'","\\'")}')">移除</button></div>`}).join(''):'尚未收藏景點。')}
 if(t==='budget'){let rows=JSON.parse(localStorage.getItem('expenses')||'[]');p.innerHTML=`<h3>每日花費</h3><div class="grid"><input class="moneyinput" id="expName" placeholder="項目"><input class="moneyinput" id="expAmt" type="number" placeholder="韓元金額"></div><p><button class="primary" onclick="addExpense()">加入</button></p><div id="expenseRows">${rows.map((r,i)=>`<div class="listrow"><span>${r.name}</span><b>₩${Number(r.amt).toLocaleString()}</b></div>`).join('')}</div><p>合計：<span class="total">₩${rows.reduce((a,r)=>a+Number(r.amt),0).toLocaleString()}</span></p>`}
 if(t==='packing'){const items=['護照','信用卡','T-money／WOWPASS','行動電源','轉接插頭','羽絨外套','保暖內衣','防滑鞋','手套','圍巾','暖包','護唇膏','常用藥'];let saved=JSON.parse(localStorage.getItem('pack2')||'{}');p.innerHTML='<h3>行李清單</h3>'+items.map((x,i)=>`<label class="listrow"><span>${x}</span><input type="checkbox" ${saved[i]?'checked':''} onchange="savePack(${i},this.checked)"></label>`).join('')}
 if(t==='location'){p.innerHTML='<h3>目前位置</h3><p>按下按鈕後，瀏覽器會詢問定位權限。</p><button class="primary" onclick="locateMe()">取得位置</button><div id="locResult"></div>'}
 if(t==='currency'){const rate=localStorage.getItem('fxrate')||'0.00105';p.innerHTML=`<h3>韓元 → 澳元</h3><p class="small">請輸入你當天查到的匯率。預設僅為示例。</p><label>1 KRW = <input id="fxRate" class="moneyinput" type="number" step="0.000001" value="${rate}" onchange="localStorage.setItem('fxrate',this.value)"></label><p><input id="krw" class="moneyinput" type="number" placeholder="輸入韓元" oninput="convertFx()"></p><div id="fxOut" class="total">A$0.00</div>`}
}
function removeFav(k){setFavs(getFavs().filter(x=>x!==k));refreshFavButtons();showTool('favorites')}
function addExpense(){const n=document.getElementById('expName').value.trim(),a=Number(document.getElementById('expAmt').value);if(!n||!a)return;const rows=JSON.parse(localStorage.getItem('expenses')||'[]');rows.push({name:n,amt:a});localStorage.setItem('expenses',JSON.stringify(rows));showTool('budget')}
function savePack(i,v){const s=JSON.parse(localStorage.getItem('pack2')||'{}');s[i]=v;localStorage.setItem('pack2',JSON.stringify(s))}
function locateMe(){const out=document.getElementById('locResult');if(!navigator.geolocation){out.textContent='此裝置不支援定位。';return}out.textContent='定位中…';navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;out.innerHTML=`<p>緯度 ${latitude.toFixed(5)}，經度 ${longitude.toFixed(5)}</p><div class="maplinks"><a target="_blank" href="https://www.google.com/maps?q=${latitude},${longitude}">在 Google Maps 開啟</a></div>`},()=>out.textContent='無法取得位置，請檢查瀏覽器權限。')}
function convertFx(){const r=Number(document.getElementById('fxRate').value),k=Number(document.getElementById('krw').value);document.getElementById('fxOut').textContent='A$'+(r*k).toFixed(2)}
if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');
setTimeout(refreshFavButtons,0);

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))}
</script>
</body>
</html>
